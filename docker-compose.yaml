services:
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "1234:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-cards}
      AUTH_REMEMBER_ME_SECRET: ${AUTH_REMEMBER_ME_SECRET:-imadj-remember-me-change-me-please}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
    depends_on:
      - postgres
      - minio
  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/mnt/data
      - ./minio.license:/minio.license:ro

    command:
      - server
      - /mnt/data
      - --console-address
      - ":9001"
      - --license
      - /minio.license

volumes:
  minio_data:
