spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: imadjOnline
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 30d
      cookie:
        name: JSESSIONID
        path: /
        max-age: 2592000
        same-site: lax
        http-only: true

server:
  port: ${SERVER_PORT:8080}

auth:
  remember-me-secret: ${AUTH_REMEMBER_ME_SECRET:${MINIO_ROOT_PASSWORD:imadj-dev-secret}}

logging:
  level:
    com.github.vad_ik.imadjOnline: INFO
    com.github.vad_ik.imadjOnline.config.RequestLoggingFilter: INFO
    com.github.vad_ik.imadjOnline.service.LobbyService: INFO

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  region: ${MINIO_REGION:us-east-1}
  bucket: ${MINIO_BUCKET:cards}
  presign-ttl-minutes: ${MINIO_PRESIGN_TTL_MINUTES:60}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    enabled: ${TELEGRAM_BOT_ENABLED:false}

deck:
  max-cards: ${DECK_MAX_CARDS:200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
